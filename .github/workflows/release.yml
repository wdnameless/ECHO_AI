name: Build & Release

on:
  push:
    tags:
      - 'v*'
    # A release must be able to start from a merge, not only from a hand-made
    # tag. Tagging by hand is what made "запуш в гит… версия не меняется" a
    # recurring complaint: the code was on master while users kept the old build,
    # because nothing in CI ran for a branch push.
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: a tag push and a branch push for the same version
# otherwise pass `check` together and race `gh release create` — the loser
# fails after a full Tauri build. Serial, never cancelled.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Decides WHETHER this run builds a release.
  #
  # A branch push does not carry a version change every time, and the release tag
  # is derived from the version — so without this guard every ordinary push to
  # master would try to reuse an existing tag and fail the build. The rule:
  # release when the version has not been released yet (or when a human asked).
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this run releases
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Check whether release already exists AND whether it is published.
          # Existing complete published releases must NEVER be rebuilt, overwritten,
          # or demoted to draft. Only new or incomplete draft releases are built.
          is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo "not_found")
          if [ "$is_draft" = "false" ]; then
            echo "Published release $tag already exists and is complete; nothing to build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run for unreleased/draft $tag: releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag push releases if no complete published release exists.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Tag push (${{ github.ref_name }}) for unreleased/draft $tag: releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            echo "Release $tag exists as draft (incomplete previous build); rebuilding to complete release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has not been released yet: building."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set or empty. Release builds require signing credentials."
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify engine resources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $resourceDir = "src-tauri/resources"

          # The engine binary and its ggml libraries are committed, because they
          # are embedded into the app at compile time (include_bytes!). Nothing
          # is downloaded here: a fresh checkout builds offline.
          #
          # The speech model is NOT bundled any more. It used to account for
          # ~751 MB of a 738 MB installer, which ruled out a portable build and
          # gave the user no choice of model. It is downloaded at runtime into
          # the directory the user picks, and verified against the SHA-256
          # published by Hugging Face.
          if (!(Test-Path $resourceDir)) {
            Write-Error "Resource directory $resourceDir is missing"
          }
          if (Test-Path (Join-Path $resourceDir "nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf")) {
            Write-Error "A model file is present in the resource directory; the installer must not bundle models"
          }

          $checksumFile = Join-Path $resourceDir "CHECKSUMS.sha256"
          if (!(Test-Path $checksumFile)) {
            Write-Error "CHECKSUMS.sha256 manifest not found at $checksumFile"
          }

          Write-Host "Verifying engine files against $checksumFile..."
          $lines = Get-Content $checksumFile
          foreach ($line in $lines) {
            $trimmed = $line.Trim()
            if ([string]::IsNullOrWhiteSpace($trimmed) -or $trimmed.StartsWith("#")) {
              continue
            }
            $parts = -split $trimmed
            $expectedHash = $parts[0].ToLower()
            $fileName = $parts[1]

            # The model is intentionally absent from the app; its checksum line
            # is retained as the record of what used to be bundled.
            if ($fileName -like "*.gguf") {
              continue
            }

            $filePath = Join-Path $resourceDir $fileName
            if (!(Test-Path $filePath)) {
              Write-Error "Required resource file missing: $fileName"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -Path $filePath).Hash.ToLower()
            if ($actualHash -ne $expectedHash) {
              Write-Error "Checksum mismatch for $fileName. Expected: $expectedHash, Actual: $actualHash"
            }
            Write-Host "Verified $fileName ($actualHash)"
          }
          Write-Host "All engine resources verified successfully."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Ensure release exists (PAT)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          # The tag comes from the VERSION, never from the ref name.
          #
          # `GITHUB_REF_NAME` is the branch (`master`) on a branch push, so this
          # step would have created a release literally named "master" while the
          # build below uploaded assets under `v<version>` — two releases, and
          # the real one missing notes. Manual runs had the same problem.
          version="${{ needs.check.outputs.version }}"
          tag="v${version}"
          is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo "not_found")
          if [ "$is_draft" = "false" ]; then
            echo "::error::Release $tag is already published and complete. Refusing to demote to draft or overwrite."
            exit 1
          elif [ "$is_draft" = "true" ]; then
            echo "Release $tag exists as draft; proceeding with build."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Echo AI $tag" \
              --notes "Auto-generated release." \
              --draft
            echo "Draft release $tag created with PAT."
            # (No --verify-tag: on a branch push the git tag does not exist yet
            # and `gh release create` mints it via the API.)
          fi
      - name: Build & Publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Echo AI v__VERSION__"
          releaseBody: "Auto-generated release from the latest push."
          releaseDraft: true
          prerelease: false

      - name: Build portable archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # The exe exists only AFTER tauri-action built it: this step used to run
          # before the build and failed every release with "Release executable
          # not found in src-tauri/target/release". Order is load-bearing here.
          #
          # A single-file build: the engine and its libraries are embedded in
          # the executable and extracted on first run, so this archive is just
          # the exe plus a marker that turns on portable mode. The speech model
          # is not included — the user picks and downloads one on first launch,
          # which is what keeps this download around 20 MB instead of 738 MB.
          $stage = "portable-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "pluely-asr" } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "Release executable not found in src-tauri/target/release"
          }
          Write-Host "Packaging $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"

          Copy-Item $exe.FullName (Join-Path $stage "Echo AI.exe")
          # Dropping this file switches the app into portable mode: settings,
          # engine and downloaded models stay inside the same folder.
          Set-Content -Path (Join-Path $stage ".portable") -Value "portable" -NoNewline

          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $archive = "Echo.AI_${version}_portable_x64.zip"
          $items = Get-ChildItem -Path $stage -Force | ForEach-Object { $_.FullName }
          Compress-Archive -Path $items -DestinationPath $archive -Force
          Write-Host "Portable archive: $archive ($([math]::Round((Get-Item $archive).Length / 1MB, 1)) MB)"

      - name: Sign portable archive for the updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          archive="Echo.AI_${version}_portable_x64.zip"
          # Same key the MSI/NSIS updater targets use: the updater verifies the
          # zip bytes against the signature recorded in latest.json and refuses
          # the update when they do not match (fail-closed).
          # Uses npm-ci-installed CLI and standard signer behavior (creates .sig automatically).
          npx --no-install tauri signer sign "$archive" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Signed $archive ($archive.sig)"

      - name: Validate portable archive and signature
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          archive="Echo.AI_${version}_portable_x64.zip"
          node scripts/portable-release.mjs validate-archive "$archive" "${archive}.sig" "Echo AI.exe"
          echo "Validated $archive shape and signature."

      - name: Upload portable archive to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}"
          archive="Echo.AI_${version}_portable_x64.zip"
          gh release upload "$tag" "$archive" "${archive}.sig" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded $archive + sig to draft release $tag"

      - name: Patch and validate latest.json with the portable target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          # tauri-action writes latest.json with only the MSI/NSIS targets it
          # built. The portable zip is hand-built, so its target is patched in:
          # download latest.json, patch windows-x86_64-portable pointing at the
          # uploaded zip + sig, validate manifest target and preservation of installed
          # targets, then upload.
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}"
          archive="Echo.AI_${version}_portable_x64.zip"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" --clobber --output ./latest.json
          node scripts/portable-release.mjs patch-manifest ./latest.json "$version" "$archive" "${archive}.sig" "$GITHUB_REPOSITORY"
          node scripts/portable-release.mjs validate-manifest ./latest.json "$version" "$archive" "${archive}.sig" "$GITHUB_REPOSITORY"
          gh release upload "$tag" ./latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "Patched, validated and uploaded latest.json with windows-x86_64-portable"

      - name: Publish and promote release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Promoted release $tag from draft to published latest."
