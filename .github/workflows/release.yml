name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set or empty. Release builds require signing credentials."
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify engine resources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $resourceDir = "src-tauri/resources"

          # The engine binary and its ggml libraries are committed, because they
          # are embedded into the app at compile time (include_bytes!). Nothing
          # is downloaded here: a fresh checkout builds offline.
          #
          # The speech model is NOT bundled any more. It used to account for
          # ~751 MB of a 738 MB installer, which ruled out a portable build and
          # gave the user no choice of model. It is downloaded at runtime into
          # the directory the user picks, and verified against the SHA-256
          # published by Hugging Face.
          if (!(Test-Path $resourceDir)) {
            Write-Error "Resource directory $resourceDir is missing"
          }
          if (Test-Path (Join-Path $resourceDir "nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf")) {
            Write-Error "A model file is present in the resource directory; the installer must not bundle models"
          }

          $checksumFile = Join-Path $resourceDir "CHECKSUMS.sha256"
          if (!(Test-Path $checksumFile)) {
            Write-Error "CHECKSUMS.sha256 manifest not found at $checksumFile"
          }

          Write-Host "Verifying engine files against $checksumFile..."
          $lines = Get-Content $checksumFile
          foreach ($line in $lines) {
            $trimmed = $line.Trim()
            if ([string]::IsNullOrWhiteSpace($trimmed) -or $trimmed.StartsWith("#")) {
              continue
            }
            $parts = -split $trimmed
            $expectedHash = $parts[0].ToLower()
            $fileName = $parts[1]

            # The model is intentionally absent from the app; its checksum line
            # is retained as the record of what used to be bundled.
            if ($fileName -like "*.gguf") {
              continue
            }

            $filePath = Join-Path $resourceDir $fileName
            if (!(Test-Path $filePath)) {
              Write-Error "Required resource file missing: $fileName"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -Path $filePath).Hash.ToLower()
            if ($actualHash -ne $expectedHash) {
              Write-Error "Checksum mismatch for $fileName. Expected: $expectedHash, Actual: $actualHash"
            }
            Write-Host "Verified $fileName ($actualHash)"
          }
          Write-Host "All engine resources verified successfully."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Ensure release exists (PAT)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists - publishing if draft."
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false >/dev/null 2>&1 || true
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Echo AI $GITHUB_REF_NAME" \
              --notes "Auto-generated release." \
              --verify-tag
            echo "Release $GITHUB_REF_NAME created with PAT."
          fi
      - name: Build & Publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Echo AI v__VERSION__"
          releaseBody: "Auto-generated release from the latest push."
          releaseDraft: false
          prerelease: false

      - name: Build portable archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # A single-file build: the engine and its libraries are embedded in
          # the executable and extracted on first run, so this archive is just
          # the exe plus a marker that turns on portable mode. The speech model
          # is not included — the user picks and downloads one on first launch,
          # which is what keeps this download around 20 MB instead of 738 MB.
          $stage = "portable-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "pluely-asr" } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "Release executable not found in src-tauri/target/release"
          }
          Write-Host "Packaging $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"

          Copy-Item $exe.FullName (Join-Path $stage "Echo AI.exe")
          # Dropping this file switches the app into portable mode: settings,
          # engine and downloaded models stay inside the same folder.
          Set-Content -Path (Join-Path $stage ".portable") -Value "portable" -NoNewline

          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $archive = "Echo.AI_${version}_portable_x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          Write-Host "Portable archive: $archive ($([math]::Round((Get-Item $archive).Length / 1MB, 1)) MB)"

      - name: Upload portable archive to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          archive="Echo.AI_${version}_portable_x64.zip"
          gh release upload "v${version}" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded $archive"
