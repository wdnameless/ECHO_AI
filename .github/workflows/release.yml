name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set or empty. Release builds require signing credentials."
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare Windows runtime resources
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $resourceDir = "src-tauri/resources"
          if (!(Test-Path $resourceDir)) {
            New-Item -ItemType Directory -Path $resourceDir -Force | Out-Null
          }
          
          # Download sidecar bundle. The repo is PRIVATE: releases/download
          # anonymous links 404. Also: spaces inside a --jq expression make
          # PowerShell split it into two argv entries (gh: accepts 1 arg),
          # so parse JSON with ConvertFrom-Json instead of jq filtering.
          $release = gh api repos/wdnameless/pluely/releases/tags/resources-v0.1.0 | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq "pluely-asr-windows-x64-v0.1.0.zip" }
          if (-not $asset) { Write-Error "Sidecar asset not found in resources-v0.1.0 release" }
          Write-Host "Downloading sidecar asset id=$($asset.id)..."
          curl.exe -sS -L -o pluely-asr-windows-x64-v0.1.0.zip -H "Authorization: token $env:GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/repos/wdnameless/pluely/releases/assets/$($asset.id)"
          Expand-Archive -Path pluely-asr-windows-x64-v0.1.0.zip -DestinationPath $resourceDir -Force
          Remove-Item -Path pluely-asr-windows-x64-v0.1.0.zip -Force
          
          # Download Nemotron model from immutable HuggingFace snapshot
          $modelUrl = "https://huggingface.co/handy-computer/nemotron-3.5-asr-streaming-0.6b-gguf/resolve/6d44e540bc31b0de1dbe174a3cea87f53a7f22fb/nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf"
          $modelDest = Join-Path $resourceDir "nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf"
          Write-Host "Downloading model from $modelUrl..."
          Invoke-WebRequest -Uri $modelUrl -OutFile $modelDest -UseBasicParsing
          
          # Verify all files against CHECKSUMS.sha256
          $checksumFile = Join-Path $resourceDir "CHECKSUMS.sha256"
          if (!(Test-Path $checksumFile)) {
            Write-Error "CHECKSUMS.sha256 manifest not found at $checksumFile"
          }
          Write-Host "Verifying checksums against $checksumFile..."
          $lines = Get-Content $checksumFile
          foreach ($line in $lines) {
            $trimmed = $line.Trim()
            if ([string]::IsNullOrWhiteSpace($trimmed) -or $trimmed.StartsWith("#")) {
              continue
            }
            $parts = -split $trimmed
            $expectedHash = $parts[0].ToLower()
            $fileName = $parts[1]
            $filePath = Join-Path $resourceDir $fileName
            if (!(Test-Path $filePath)) {
              Write-Error "Required resource file missing: $fileName"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -Path $filePath).Hash.ToLower()
            if ($actualHash -ne $expectedHash) {
              Write-Error "Checksum mismatch for $fileName. Expected: $expectedHash, Actual: $actualHash"
            }
            Write-Host "Verified $fileName ($actualHash)"
          }
          Write-Host "All resources verified successfully."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Ensure release exists (PAT)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo wdnameless/pluely >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists - publishing if draft."
            gh release edit "$GITHUB_REF_NAME" --repo wdnameless/pluely --draft=false >/dev/null 2>&1 || true
          else
            gh release create "$GITHUB_REF_NAME" --repo wdnameless/pluely \
              --title "Pluely $GITHUB_REF_NAME" \
              --notes "Auto-generated release." \
              --verify-tag
            echo "Release $GITHUB_REF_NAME created with PAT."
          fi
      - name: Build & Publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Pluely v__VERSION__"
          releaseBody: "Auto-generated release from the latest push."
          releaseDraft: false
          prerelease: false
