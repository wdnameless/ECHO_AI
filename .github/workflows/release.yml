name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set or empty. Release builds require signing credentials."
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare Windows runtime resources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $resourceDir = "src-tauri/resources"
          if (!(Test-Path $resourceDir)) {
            New-Item -ItemType Directory -Path $resourceDir -Force | Out-Null
          }

          # Sidecar bundle comes from a public release on this repository, so the
          # plain download URL works without a token. Pinned by tag + filename;
          # contents are verified against CHECKSUMS.sha256 below.
          $sidecarUrl = "https://github.com/wdnameless/ECHO_AI/releases/download/resources-v0.1.0/pluely-asr-windows-x64-v0.1.2.zip"
          Write-Host "Downloading sidecar from $sidecarUrl..."
          curl.exe -sS -L -o pluely-asr-windows-x64-v0.1.2.zip $sidecarUrl
          if (!(Test-Path pluely-asr-windows-x64-v0.1.2.zip)) {
            Write-Error "Sidecar download produced no file"
          }
          Expand-Archive -Path pluely-asr-windows-x64-v0.1.2.zip -DestinationPath $resourceDir -Force
          Remove-Item -Path pluely-asr-windows-x64-v0.1.2.zip -Force
          
          # Download Nemotron model from immutable HuggingFace snapshot
          $modelUrl = "https://huggingface.co/handy-computer/nemotron-3.5-asr-streaming-0.6b-gguf/resolve/6d44e540bc31b0de1dbe174a3cea87f53a7f22fb/nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf"
          $modelDest = Join-Path $resourceDir "nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf"
          Write-Host "Downloading model from $modelUrl..."
          Invoke-WebRequest -Uri $modelUrl -OutFile $modelDest -UseBasicParsing
          
          # Verify all files against CHECKSUMS.sha256
          $checksumFile = Join-Path $resourceDir "CHECKSUMS.sha256"
          if (!(Test-Path $checksumFile)) {
            Write-Error "CHECKSUMS.sha256 manifest not found at $checksumFile"
          }
          Write-Host "Verifying checksums against $checksumFile..."
          $lines = Get-Content $checksumFile
          foreach ($line in $lines) {
            $trimmed = $line.Trim()
            if ([string]::IsNullOrWhiteSpace($trimmed) -or $trimmed.StartsWith("#")) {
              continue
            }
            $parts = -split $trimmed
            $expectedHash = $parts[0].ToLower()
            $fileName = $parts[1]
            $filePath = Join-Path $resourceDir $fileName
            if (!(Test-Path $filePath)) {
              Write-Error "Required resource file missing: $fileName"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -Path $filePath).Hash.ToLower()
            if ($actualHash -ne $expectedHash) {
              Write-Error "Checksum mismatch for $fileName. Expected: $expectedHash, Actual: $actualHash"
            }
            Write-Host "Verified $fileName ($actualHash)"
          }
          Write-Host "All resources verified successfully."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Ensure release exists (PAT)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists - publishing if draft."
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false >/dev/null 2>&1 || true
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Echo AI $GITHUB_REF_NAME" \
              --notes "Auto-generated release." \
              --verify-tag
            echo "Release $GITHUB_REF_NAME created with PAT."
          fi
      - name: Build & Publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Echo AI v__VERSION__"
          releaseBody: "Auto-generated release from the latest push."
          releaseDraft: false
          prerelease: false
