schema: spec-driven
created: 2026-09-16
title: "Портативная сборка, свои пути и выбор модели распознавания"
status: implemented
verified: 2026-09-16
release: v1.2.0
summary: >
  Модель распознавания перестала быть частью поставки (751 МБ из 738 МБ
  установщика), движок вшит в исполняемый файл и распаковывается сам, а пути к
  движку, моделям и логам задаёт пользователь. Каталог из 71 модели в 15
  семействах генерируется из Hugging Face, загрузка проверяется по SHA-256 и
  продолжается после обрыва.

verified_evidence:
  - "cargo test 32, vitest 275, tsc чисто"
  - "портативная сборка запускается из одного файла: движок распакован, модель
     загружена, окно отрисовано"
  - "каталог в UI: 72 карточки, поиск 72 -> 13, 6 квантизаций"
  - "перенос загрузки: обрыв на 8 396 142 байт, продолжение с 8 404 334,
     финальный SHA-256 совпал"
  - "Job Object: force-kill приложения -> сайдкар умирает за 4 с"

open_items:
  - what: "T2.8 — встраивание движка для Linux/macOS"
    why_blocked: >
      В наборе есть только pluely-asr.exe (Windows). Бинарника под Linux/macOS
      не существует в этом репозитории, собрать его не из чего, поэтому
      встраивание невозможно. На этих платформах движок ищется рядом с
      приложением — прежнее поведение сохранено.
  - what: "T7.12 — ручная установка NSIS/MSI"
    why_blocked: >
      Проверялись портативный архив и локальные сборки. Установщик требует
      интерактивной установки в систему; это шаг для владельца продукта.
