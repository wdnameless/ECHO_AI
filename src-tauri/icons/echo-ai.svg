<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Echo AI — знак: источник звука (точка) и две расходящиеся волны.

    Почему так: приложение слушает речь и отвечает, а имя — Echo. Точка с
    двумя дугами читается как «звук пошёл и повторился», то есть буквально
    эхо, и при этом состоит из трёх фигур. Знак проверен на 16 px: точка
    2.5 px, дуги 1.4 px на радиусах 3.4 и 6.1 px — три различимые кривые,
    а не серое пятно. Прежний знак (профиль головы + пиксельная сетка +
    три дуги) на 16 px рассыпался в кашу: девять прямоугольников по 1 px.

    Фон — тёмный скруглённый квадрат: приложение монохромное
    (в палитре ноль хромы), поэтому белый знак на графите — в тон системе,
    а не случайный цвет.

    Геометрия (центр дуг в 168,256 — так bounding box знака стоит по центру
    холста, а не сам центр дуг):
      точка        r = 40
      дуга 1       r = 110, разворот ±46°, толщина 44
      дуга 2       r = 195, разворот ±54°, толщина 44
    Развороты растут наружу: волна расширяется, как настоящее эхо.
    Промежутки: 48 px от точки до дуги 1, 41 px между дугами — ровный ритм.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <g fill="#FFFFFF">
    <circle cx="168" cy="256" r="40"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round">
    <path d="M 244.4 176.9 A 110 110 0 0 1 244.4 335.1"/>
    <path d="M 282.6 98.2 A 195 195 0 0 1 282.6 413.8"/>
  </g>
</svg>
