<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Echo AI — знак: профиль человека, обращённый вправо; затылок распадается
    на цифровые пиксели, от рта расходятся звуковые волны.
    Векторная версия: масштабируется без потерь, перекрашивается через fill.
  -->
  <rect width="512" height="512" rx="112" fill="#000000"/>

  <g fill="#FFFFFF">
    <!-- Голова в профиль, лицом вправо. Затылок — ровная граница под пиксели.
         Нос, губы и подбородок заданы явными точками, чтобы силуэт читался. -->
    <path d="
      M 216 448
      L 216 316
      C 216 280 212 244 220 214
      C 230 174 262 142 306 138
      C 350 134 386 162 396 206
      C 400 226 398 240 402 250
      C 404 256 410 258 414 262
      C 420 268 420 276 412 280
      L 400 288
      C 398 292 402 296 404 302
      C 406 312 400 318 390 320
      C 384 321 380 324 382 330
      C 384 338 382 346 372 352
      C 362 358 348 358 338 366
      C 326 376 320 390 322 408
      C 323 422 328 436 336 448
      Z" />

    <!-- Цифровой затылок: пиксельная сетка, продолжающая силуэт влево. -->
    <rect x="120" y="196" width="30" height="30"/>
    <rect x="114" y="232" width="16" height="16"/>
    <rect x="120" y="266" width="30" height="30"/>
    <rect x="120" y="302" width="30" height="30"/>

    <rect x="154" y="162" width="30" height="30"/>
    <rect x="154" y="198" width="30" height="30"/>
    <rect x="154" y="234" width="30" height="30"/>
    <rect x="154" y="270" width="30" height="30"/>
    <rect x="154" y="306" width="30" height="30"/>

    <rect x="188" y="142" width="26" height="26"/>
    <rect x="188" y="178" width="30" height="30"/>
    <rect x="188" y="214" width="30" height="30"/>
    <rect x="188" y="250" width="30" height="30"/>
    <rect x="188" y="286" width="30" height="30"/>
    <rect x="188" y="322" width="26" height="26"/>
  </g>

  <!-- Звуковые волны: три дуги справа от лица, растут от рта наружу. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M 392 236 A 52 52 0 0 1 392 336" stroke-width="18"/>
    <path d="M 420 210 A 96 96 0 0 1 420 362" stroke-width="20"/>
    <path d="M 450 184 A 142 142 0 0 1 450 388" stroke-width="22"/>
  </g>
</svg>
